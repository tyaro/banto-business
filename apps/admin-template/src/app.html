<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- `viewport-fit=cover` は Android / iOS の edge-to-edge 描画で
		     `env(safe-area-inset-*)` を有効にするために要る。**これが無いと
		     inset は常に 0 を返す**ので、app.css のセーフエリア用トークンが
		     すべて 0 になり、ステータスバーの下にヘッダが潜り込む
		     （Phase 8 ステップ5、実機で確認）。デスクトップのブラウザには
		     影響しない（inset が無いので 0 のまま）。 -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- PWA installable-only (M-review 2026-08 §2.8): a web manifest + icons
		     so the LAN-browser build can be "Add to Home Screen"/installed. No
		     service worker (no offline scope). `%sveltekit.assets%` keeps the
		     manifest URL correct under BASE_PATH (Pages demo); the manifest's
		     own paths are relative, so it needs no base awareness. NOTE: browsers
		     only offer install over a secure context — the embedded LAN server is
		     plain HTTP by design (ADR-0003, TLS via reverse proxy), so install is
		     available on HTTPS / localhost / behind a TLS proxy, inert on plain
		     HTTP LAN. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="theme-color" content="#2563eb" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Banto Business" />
		<!-- axe-core wcag2a document-title (visual-refresh-plan.md §7.1): a
		     static fallback so every route has a non-empty <title> even
		     without its own <svelte:head> override (only routes/panel/[id]
		     sets a dynamic one, spec §5.3's pop-out windows). -->
		<title>Banto Business</title>
		<script>
			// Apply the persisted theme + preset + locale before first paint to avoid a
			// flash. Storage keys must match src/lib/settings.svelte.ts and
			// src/lib/banto/locale.ts. Locale defaults to 'ja' (the effective
			// default display locale; base/source locale is 'en') so a fresh tab
			// renders exactly as before (ADR-0005).
			(function () {
				try {
					var mode = localStorage.getItem('banto.theme') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
					var preset = localStorage.getItem('banto.preset');
					document.documentElement.dataset.bantoPreset = preset === 'glass' ? 'glass' : 'standard';
					var density = localStorage.getItem('banto.density');
					document.documentElement.dataset.bantoDensity =
						density === 'compact' ? 'compact' : 'standard';
					var locale = localStorage.getItem('banto.locale');
					document.documentElement.lang = locale === 'en' || locale === 'ja' ? locale : 'ja';
				} catch (_) {
					document.documentElement.dataset.theme = 'light';
					document.documentElement.dataset.bantoPreset = 'standard';
					document.documentElement.dataset.bantoDensity = 'standard';
					document.documentElement.lang = 'ja';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
