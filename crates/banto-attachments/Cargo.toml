[package]
name = "banto-attachments"
description = "Banto attachments: resource-agnostic file/image attachment metadata, storage, and thumbnail generation (spec docs/attachments-plan.md §3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# PostgreSQL backend (V2 "PostgreSQL アプリ全体対応", PR2). Off by default so
# the crate stays SQLite-only in ordinary builds; enabling it forwards to
# `banto-storage`'s Postgres backend and links sqlx's Postgres driver so the
# `AttachmentsService` enum-dispatch code's Postgres arm compiles. Not
# exercised until PR3 wires an actual Postgres pool.
postgres = ["banto-storage/postgres", "sqlx/postgres"]

[dependencies]
banto-core = { workspace = true }
# V2 PR2: the service now holds a backend-agnostic `banto_storage::Db` handle
# instead of a concrete `SqlitePool`. `banto-storage` is a lower-level
# workspace crate (it depends only on `banto-core`), so this is a normal
# downward dependency - not the forbidden reverse dependency (this crate is
# meant to be depended ON by `admin-template-core`, and `banto-storage` sits
# below both).
banto-storage = { workspace = true, features = ["sqlite"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { workspace = true, features = ["fs"] }
serde = { workspace = true }
# Thumbnail generation (spec §3.4): an explicit, documented exception to the
# workspace's "do not add dependencies lightly" default - image thumbnails
# are M20's core value and a self-rolled decoder/encoder is not realistic.
# `default-features = false` + this exact feature list keeps the dependency
# tree limited to the four formats attachments actually supports (JPEG/PNG/
# WebP/GIF magic-byte detection, spec §3.4) - notably no AVIF/HEIF/TIFF/etc.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
] }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = { workspace = true }
